<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Yangiliklar Tahlili</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #e8eaf0;
      --muted: #9aa0b0;
      --accent: #4f8cff;
      --border: #2a2e3d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 32px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.6rem; margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 20px;
    }
    .filters button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .filters button:hover { border-color: var(--accent); }
    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(79, 140, 255, 0.15);
      color: var(--accent);
    }
    .stars { font-size: 1rem; letter-spacing: 2px; }
    .card h2 { font-size: 1.15rem; margin-bottom: 10px; line-height: 1.4; }
    .card .xulosa { color: var(--text); line-height: 1.6; margin-bottom: 14px; }
    .amaliy {
      background: rgba(79, 140, 255, 0.08);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 12px;
    }
    .amaliy strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 0.82rem; }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-footer a { color: var(--accent); text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      line-height: 1.7;
    }
    .updated { text-align: center; color: var(--muted); font-size: 0.8rem; padding-bottom: 16px; }
    code {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Yangiliklar Tahlili</h1>
    <p>Jahon sun'iy intellekt yangiliklari — o'zbek tilida, qisqa va tushunarli</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="updated" id="updated"></div>
  <main id="cards"></main>

  <script>
    const KATEGORIYALAR = ["Hammasi", "OpenAI", "Gemini", "Claude", "xAI", "Meta", "DeepSeek", "Boshqa"];
    let activeFilter = "Hammasi";
    let allData = [];

    function renderFilters() {
      const container = document.getElementById("filters");
      container.innerHTML = "";
      for (const kat of KATEGORIYALAR) {
        const btn = document.createElement("button");
        btn.textContent = kat;
        btn.className = kat === activeFilter ? "active" : "";
        btn.onclick = () => { activeFilter = kat; renderFilters(); renderCards(); };
        container.appendChild(btn);
      }
    }

    function renderCards() {
      const main = document.getElementById("cards");
      const items = activeFilter === "Hammasi"
        ? allData
        : allData.filter((item) => item.kategoriya === activeFilter);

      if (items.length === 0) {
        main.innerHTML = `<div class="empty">
          Hozircha tahlillar yo'q.<br/>
          Yangiliklarni yig'ish uchun terminalda <code>npm run analyze</code> buyrug'ini ishga tushiring.
        </div>`;
        return;
      }

      main.innerHTML = items.map((item) => `
        <article class="card">
          <div class="card-top">
            <span class="badge">${item.kategoriya}</span>
            <span class="stars">${item.ahamiyati}</span>
          </div>
          <h2>${item.sarlavha}</h2>
          <p class="xulosa">${item.xulosa}</p>
          <div class="amaliy">
            <strong>💡 BU NIMA DEGANI?</strong>
            ${item.amaliy_ahamiyat}
          </div>
          <div class="card-footer">
            <span>${item.sana ? new Date(item.sana).toLocaleDateString("uz-UZ") : ""}</span>
            ${item.manba ? `<a href="${item.manba}" target="_blank" rel="noopener">Asl manba →</a>` : ""}
          </div>
        </article>
      `).join("");
    }

    async function load() {
      renderFilters();
      try {
        const res = await fetch("/api/tahlillar");
        const data = await res.json();
        allData = data.tahlillar || [];
        if (data.yangilangan_vaqt) {
          document.getElementById("updated").textContent =
            "Oxirgi yangilanish: " + new Date(data.yangilangan_vaqt).toLocaleString("uz-UZ");
        }
      } catch (err) {
        allData = [];
      }
      renderCards();
    }

    load();
  </script>
</body>
</html>
